name: Check dictionary app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r DataConverter/requirements.txt
      - run: python3 -m unittest discover -s DataConverter -p 'test_*.py' -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk --debug
          - os: ubuntu-latest
            target: linux --release
          - os: windows-latest
            target: windows --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        if: startsWith(matrix.target, 'apk')
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Linux build prerequisites
        if: startsWith(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }}
      - name: Package Windows download
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tool/package_windows.ps1
      - name: Save Windows download
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: matigsalug-dictionary-windows-x64
          path: build/releases/*-windows-x64.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
